jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
extra_instruction_paths: [harbor/report-request.md]
artifacts: [/app/result.json, /app/report.md]
agents:
  - name: terminus-2
    model_name: anthropic/MODEL_A
  - name: terminus-2
    model_name: openai/MODEL_B
  - name: mini-swe-agent
    model_name: anthropic/MODEL_A
    kwargs: {version: "2.4.6"}
  - name: mini-swe-agent
    model_name: openai/MODEL_B
    kwargs: {version: "2.4.6"}
  - name: claude-code
    model_name: anthropic/MODEL_A
    kwargs: {version: "2.1.312"}
  - name: codex
    model_name: openai/MODEL_B
    kwargs: {version: "0.165.0"}
  - name: openhands-sdk
    model_name: anthropic/MODEL_A
    kwargs: {version: "1.58.2"}
  - name: openhands-sdk
    model_name: openai/MODEL_B
    kwargs: {version: "1.58.2"}
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
environment:
  type: docker
  force_build: false
  delete: false
  env:
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
datasets:
  - path: datasets/replicationbench
    task_names:
      - gw_cosmo__dark_energy
      - gw_cosmo__h0_scaling
      - gw_cosmo__measure_combo
      - gw_cosmo__modified_gravity
      - mars_clouds__dbscan_test
      - mars_clouds__dbscan_optimization
